apply plugin: 'com.android.application'

android {
    compileSdkVersion 27
    defaultConfig {
        applicationId "com.orpheusdroid.sqliteviewer"
        minSdkVersion 19
        targetSdkVersion 27
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }
    signingConfigs {
        release
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.getByName("debug")
        }
    }

    flavorDimensions "tier"
    productFlavors {
        fdroid {
            dimension "tier"
        }
    }
}

ext.supportLibraryVersion = '27.1.1'
ext.constraintLayoutLibraryVersion = '1.1.2'

dependencies {
    // Precompiled project libraries to include
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Android support libraries
    implementation "com.android.support:appcompat-v7:$supportLibraryVersion"
    implementation "com.android.support:cardview-v7:$supportLibraryVersion"
    implementation "com.android.support:design:$supportLibraryVersion"
    implementation "com.android.support:support-v4:$supportLibraryVersion"
    implementation "com.android.support:support-vector-drawable:$supportLibraryVersion"
    implementation "com.android.support:cardview-v7:$supportLibraryVersion"
    implementation "com.android.support:recyclerview-v7:$supportLibraryVersion"

    implementation "com.android.support.constraint:constraint-layout:$constraintLayoutLibraryVersion"

    // External libraries
    implementation "com.github.topjohnwu:libsu:2.0.0"
    implementation 'com.github.evrencoskun:TableView:0.8.8'
    implementation('com.github.ViksaaSkool:AwesomeSplash:v1.0.0', {
        exclude group: 'com.android.support'
    })
    implementation 'de.siegmar:fastcsv:1.0.2'

}
